---
layout: archive
author_profile: true
sidebar_main: true
entries_layout: list
---

<div class="sort-toggle">
  <button id="sort-popular" class="btn btn--primary btn--small sort-btn active">인기순</button>
  <button id="sort-latest" class="btn btn--inverse btn--small sort-btn">최신순</button>
</div>

{% assign sorted_posts = site.posts | sort: "popularity" | reverse %}
<div class="grid__wrapper" id="post-list">
  {% for post in sorted_posts %}
    {% include archive-single3.html type="list" %}
  {% endfor %}
</div>

<nav class="pagination" id="js-pagination">
  <ul></ul>
</nav>

<script>
(function() {
  var POSTS_PER_PAGE = 5;
  var currentPage = 1;
  var currentMode = 'popularity';
  var container = document.getElementById('post-list');
  var paginationNav = document.getElementById('js-pagination');
  var paginationUl = paginationNav.querySelector('ul');

  function getItems() {
    return Array.from(container.children);
  }

  function getTotalPages() {
    return Math.ceil(getItems().length / POSTS_PER_PAGE);
  }

  function showPage(page) {
    var items = getItems();
    var totalPages = getTotalPages();
    if (page < 1) page = 1;
    if (page > totalPages) page = totalPages;
    currentPage = page;

    var start = (page - 1) * POSTS_PER_PAGE;
    var end = start + POSTS_PER_PAGE;

    items.forEach(function(item, i) {
      item.style.display = (i >= start && i < end) ? '' : 'none';
    });

    renderPagination();
  }

  function renderPagination() {
    var totalPages = getTotalPages();
    paginationUl.innerHTML = '';

    if (totalPages <= 1) {
      paginationNav.style.display = 'none';
      return;
    }
    paginationNav.style.display = '';

    // Previous
    var prevLi = document.createElement('li');
    var prevA = document.createElement('a');
    prevA.textContent = 'Previous';
    if (currentPage === 1) {
      prevA.href = '#';
      prevA.className = 'disabled';
    } else {
      prevA.href = '#';
      prevA.addEventListener('click', function(e) { e.preventDefault(); showPage(currentPage - 1); });
    }
    prevLi.appendChild(prevA);
    paginationUl.appendChild(prevLi);

    // Page numbers
    for (var i = 1; i <= totalPages; i++) {
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = '#';
      a.textContent = i;
      if (i === currentPage) {
        a.className = 'disabled current';
      } else {
        (function(pageNum) {
          a.addEventListener('click', function(e) { e.preventDefault(); showPage(pageNum); });
        })(i);
      }
      li.appendChild(a);
      paginationUl.appendChild(li);
    }

    // Next
    var nextLi = document.createElement('li');
    var nextA = document.createElement('a');
    nextA.textContent = 'Next';
    if (currentPage === totalPages) {
      nextA.href = '#';
      nextA.className = 'disabled';
    } else {
      nextA.href = '#';
      nextA.addEventListener('click', function(e) { e.preventDefault(); showPage(currentPage + 1); });
    }
    nextLi.appendChild(nextA);
    paginationUl.appendChild(nextLi);
  }

  function sortPosts(mode) {
    currentMode = mode;
    var items = getItems();

    items.sort(function(a, b) {
      if (mode === 'popularity') {
        return (parseInt(b.getAttribute('data-popularity')) || 0)
             - (parseInt(a.getAttribute('data-popularity')) || 0);
      } else {
        return b.getAttribute('data-date').localeCompare(a.getAttribute('data-date'));
      }
    });

    items.forEach(function(item) {
      container.appendChild(item);
    });

    showPage(1);

    document.querySelectorAll('.sort-btn').forEach(function(btn) {
      btn.classList.remove('active', 'btn--primary');
      btn.classList.add('btn--inverse');
    });

    var activeId = (mode === 'popularity') ? 'sort-popular' : 'sort-latest';
    var activeBtn = document.getElementById(activeId);
    activeBtn.classList.add('active');
    activeBtn.classList.remove('btn--inverse');
    activeBtn.classList.add('btn--primary');
  }

  // Event listeners
  document.getElementById('sort-popular').addEventListener('click', function() { sortPosts('popularity'); });
  document.getElementById('sort-latest').addEventListener('click', function() { sortPosts('latest'); });

  // Initialize
  showPage(1);
})();
</script>
