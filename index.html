---
layout: archive
author_profile: true
sidebar_main: true
entries_layout: list
---

<div class="sort-toggle">
  <button id="sort-popular" class="btn btn--primary btn--small sort-btn active">인기순</button>
  <button id="sort-latest" class="btn btn--inverse btn--small sort-btn">최신순</button>
</div>

{% comment %}<!-- rendered newest first (site.posts); the script below re-sorts to 인기순, the default view.
     `popularity` is a hand-set front matter rank -->{% endcomment %}
<div class="grid__wrapper" id="post-list">
  {% for post in site.posts %}
    {% include archive-single3.html type="list" %}
  {% endfor %}
</div>

<nav class="pagination" id="js-pagination">
  <ul></ul>
</nav>

<script>
(function() {
  var POSTS_PER_PAGE = 5;
  var currentPage = 1;
  var currentMode = 'latest'; // order of the list as rendered; init below switches to the default
  var container = document.getElementById('post-list');
  var sortToggle = document.querySelector('.sort-toggle');
  var paginationNav = document.getElementById('js-pagination');
  var paginationUl = paginationNav.querySelector('ul');

  function getItems() {
    return Array.from(container.children);
  }

  function getTotalPages() {
    return Math.ceil(getItems().length / POSTS_PER_PAGE);
  }

  // State lives in the address bar: ?sort=latest&page=2 (defaults — 인기순, page 1 — are left out, so it's just "/")
  function urlFor(mode, page) {
    var params = [];
    if (mode === 'latest') params.push('sort=latest');
    if (page > 1) params.push('page=' + page);
    return location.pathname + (params.length ? '?' + params.join('&') : '');
  }

  function readUrl() {
    var params = new URLSearchParams(location.search);
    return {
      mode: params.get('sort') === 'latest' ? 'latest' : 'popularity',
      page: parseInt(params.get('page'), 10) || 1
    };
  }

  function showPage(page) {
    var items = getItems();
    var totalPages = getTotalPages();
    if (page < 1) page = 1;
    if (page > totalPages) page = totalPages;
    currentPage = page;

    var start = (page - 1) * POSTS_PER_PAGE;
    var end = start + POSTS_PER_PAGE;

    items.forEach(function(item, i) {
      item.style.display = (i >= start && i < end) ? '' : 'none';
    });

    renderPagination();
  }

  function pageLink(label, page, disabledClass) {
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.textContent = label;
    if (disabledClass) {
      a.className = disabledClass;
    } else {
      // a real link, so "open in new tab" and copying the address work
      a.href = urlFor(currentMode, page);
      a.addEventListener('click', function(e) {
        if (e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) return;
        e.preventDefault();
        go(currentMode, page, true);
      });
    }
    li.appendChild(a);
    return li;
  }

  function renderPagination() {
    var totalPages = getTotalPages();
    paginationUl.innerHTML = '';

    if (totalPages <= 1) {
      paginationNav.style.display = 'none';
      return;
    }
    paginationNav.style.display = '';

    paginationUl.appendChild(pageLink('Previous', currentPage - 1, currentPage === 1 ? 'disabled' : ''));
    for (var i = 1; i <= totalPages; i++) {
      paginationUl.appendChild(pageLink(i, i, i === currentPage ? 'disabled current' : ''));
    }
    paginationUl.appendChild(pageLink('Next', currentPage + 1, currentPage === totalPages ? 'disabled' : ''));
  }

  function sortItems(mode) {
    var items = getItems();

    items.sort(function(a, b) {
      var byDate = b.getAttribute('data-date').localeCompare(a.getAttribute('data-date'));
      if (mode === 'popularity') {
        // posts without `popularity` (0) go last, newest first among equals
        return ((parseInt(b.getAttribute('data-popularity')) || 0)
              - (parseInt(a.getAttribute('data-popularity')) || 0)) || byDate;
      }
      return byDate;
    });

    items.forEach(function(item) {
      container.appendChild(item);
    });

    document.querySelectorAll('.sort-btn').forEach(function(btn) {
      btn.classList.remove('active', 'btn--primary');
      btn.classList.add('btn--inverse');
    });

    var activeId = (mode === 'popularity') ? 'sort-popular' : 'sort-latest';
    var activeBtn = document.getElementById(activeId);
    activeBtn.classList.add('active');
    activeBtn.classList.remove('btn--inverse');
    activeBtn.classList.add('btn--primary');
  }

  // Apply a sort/page; user actions also add a history entry and bring the list back into view
  function go(mode, page, fromUser) {
    if (mode !== currentMode) {
      currentMode = mode;
      sortItems(mode);
    }
    showPage(page);

    if (fromUser) {
      history.pushState(null, '', urlFor(currentMode, currentPage));
      if (sortToggle.getBoundingClientRect().top < 0) {
        sortToggle.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }
  }

  // Event listeners
  document.getElementById('sort-popular').addEventListener('click', function() { go('popularity', 1, true); });
  document.getElementById('sort-latest').addEventListener('click', function() { go('latest', 1, true); });
  window.addEventListener('popstate', function() {
    var state = readUrl();
    go(state.mode, state.page, false);
  });

  // Initialize from the address bar
  var initial = readUrl();
  go(initial.mode, initial.page, false);
})();
</script>
