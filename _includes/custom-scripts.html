<script>
  (function() {
    // ---- Dark mode toggle ----
    var DARK_HREF = '{{ "/assets/css/dark.css" | relative_url }}';
    var btn = document.getElementById('theme-toggle');

    function syncButton(theme) {
      if (!btn) return;
      var icon = btn.querySelector('i');
      icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
      btn.setAttribute('aria-label', theme === 'dark' ? '라이트 모드로 전환' : '다크 모드로 전환');
    }

    function applyTheme(theme) {
      var link = document.getElementById('theme-dark-css');
      if (theme === 'dark' && !link) {
        link = document.createElement('link');
        link.rel = 'stylesheet';
        link.id = 'theme-dark-css';
        link.href = DARK_HREF;
        document.head.appendChild(link);
      } else if (theme === 'light' && link) {
        link.parentNode.removeChild(link);
      }
      document.documentElement.setAttribute('data-theme', theme);
      window.__theme = theme;
      syncButton(theme);

      // utterances comments follow the site theme
      var frame = document.querySelector('iframe.utterances-frame');
      if (frame) {
        frame.contentWindow.postMessage(
          { type: 'set-theme', theme: theme === 'dark' ? 'github-dark' : 'github-light' },
          'https://utteranc.es'
        );
      }
    }

    syncButton(window.__theme || 'light');
    if (btn) {
      btn.addEventListener('click', function() {
        var next = (window.__theme === 'dark') ? 'light' : 'dark';
        try { localStorage.setItem('theme', next); } catch (e) {}
        applyTheme(next);
      });
    }

    // ---- TOC: collapsible below the desktop breakpoint (it renders inline above the post there) ----
    var toc = document.querySelector('nav.toc');
    if (toc && window.matchMedia('(max-width: 1279px)').matches) {
      var tocTitle = toc.querySelector('.nav__title');
      if (tocTitle) {
        toc.classList.add('toc--collapsible', 'toc--collapsed');
        tocTitle.setAttribute('role', 'button');
        tocTitle.setAttribute('tabindex', '0');
        tocTitle.setAttribute('aria-expanded', 'false');
        var toggleToc = function() {
          var collapsed = toc.classList.toggle('toc--collapsed');
          tocTitle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
        };
        tocTitle.addEventListener('click', toggleToc);
        tocTitle.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleToc(); }
        });
        // picking a section should get the menu out of the way
        toc.addEventListener('click', function(e) {
          if (e.target.closest('.toc__menu a')) {
            toc.classList.add('toc--collapsed');
            tocTitle.setAttribute('aria-expanded', 'false');
          }
        });
      }
    }

    // ---- Copy button for code blocks ----
    document.querySelectorAll('div.highlighter-rouge').forEach(function(block) {
      var pre = block.querySelector('pre');
      if (!pre || block.querySelector('.copy-code-btn')) return;

      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'copy-code-btn';
      button.textContent = '복사';
      button.addEventListener('click', function() {
        var code = pre.querySelector('code') || pre;
        var done = function() {
          button.textContent = '복사됨';
          setTimeout(function() { button.textContent = '복사'; }, 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code.innerText).then(done);
        } else {
          var ta = document.createElement('textarea');
          ta.value = code.innerText;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          done();
        }
      });
      block.appendChild(button);
    });

    // ---- MathJax: loaded only when the post text (outside code) contains TeX ----
    var article = document.querySelector('.page__content');
    if (article) {
      var text = article.cloneNode(true);
      text.querySelectorAll('pre, code, script, style').forEach(function(el) {
        el.parentNode.removeChild(el);
      });
      // kramdown turns $$..$$ into \(..\) / \[..\]; single $..$ is passed through as is
      if (/\\\(|\\\[|\$[^$\s][^$]*\$/.test(text.textContent)) {
        window.MathJax = {
          tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']],
            processEscapes: true
          }
        };
        var mathjax = document.createElement('script');
        mathjax.id = 'MathJax-script';
        mathjax.async = true;
        mathjax.src = 'https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js';
        document.head.appendChild(mathjax);
      }
    }
  })();
</script>
