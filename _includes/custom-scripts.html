<script>
  (function() {
    // ---- Dark mode toggle ----
    var DARK_HREF = '{{ "/assets/css/dark.css" | relative_url }}';
    var btn = document.getElementById('theme-toggle');
    var themeListeners = []; // other widgets that redraw on a theme change (e.g. Mermaid)

    function syncButton(theme) {
      if (!btn) return;
      var icon = btn.querySelector('i');
      icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
      btn.setAttribute('aria-label', theme === 'dark' ? '라이트 모드로 전환' : '다크 모드로 전환');
    }

    function applyTheme(theme) {
      var link = document.getElementById('theme-dark-css');
      if (theme === 'dark' && !link) {
        link = document.createElement('link');
        link.rel = 'stylesheet';
        link.id = 'theme-dark-css';
        link.href = DARK_HREF;
        document.head.appendChild(link);
      } else if (theme === 'light' && link) {
        link.parentNode.removeChild(link);
      }
      document.documentElement.setAttribute('data-theme', theme);
      window.__theme = theme;
      syncButton(theme);

      // utterances comments follow the site theme
      var frame = document.querySelector('iframe.utterances-frame');
      if (frame) {
        frame.contentWindow.postMessage(
          { type: 'set-theme', theme: theme === 'dark' ? 'github-dark' : 'github-light' },
          'https://utteranc.es'
        );
      }

      themeListeners.forEach(function(listener) { listener(theme); });
    }

    syncButton(window.__theme || 'light');
    if (btn) {
      btn.addEventListener('click', function() {
        var next = (window.__theme === 'dark') ? 'light' : 'dark';
        try { localStorage.setItem('theme', next); } catch (e) {}
        applyTheme(next);
      });
    }

    // ---- TOC: collapsible below the desktop breakpoint (it renders inline above the post there) ----
    var toc = document.querySelector('nav.toc');
    if (toc && window.matchMedia('(max-width: 1279px)').matches) {
      var tocTitle = toc.querySelector('.nav__title');
      if (tocTitle) {
        toc.classList.add('toc--collapsible', 'toc--collapsed');
        tocTitle.setAttribute('role', 'button');
        tocTitle.setAttribute('tabindex', '0');
        tocTitle.setAttribute('aria-expanded', 'false');
        var toggleToc = function() {
          var collapsed = toc.classList.toggle('toc--collapsed');
          tocTitle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
        };
        tocTitle.addEventListener('click', toggleToc);
        tocTitle.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleToc(); }
        });
        // picking a section should get the menu out of the way
        toc.addEventListener('click', function(e) {
          if (e.target.closest('.toc__menu a')) {
            toc.classList.add('toc--collapsed');
            tocTitle.setAttribute('aria-expanded', 'false');
          }
        });
      }
    }

    // ---- Clipboard (code blocks, share link) ----
    function copyText(text, done) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done);
      } else {
        var ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        done();
      }
    }

    // ---- Copy button for code blocks ----
    document.querySelectorAll('div.highlighter-rouge').forEach(function(block) {
      var pre = block.querySelector('pre');
      if (!pre || block.querySelector('.copy-code-btn')) return;

      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'copy-code-btn';
      button.textContent = '복사';
      button.addEventListener('click', function() {
        var code = pre.querySelector('code') || pre;
        copyText(code.innerText, function() {
          button.textContent = '복사됨';
          setTimeout(function() { button.textContent = '복사'; }, 1500);
        });
      });
      block.appendChild(button);
    });

    // ---- Share: copy the post link (the label is hidden on small screens, so swap the icon too) ----
    document.querySelectorAll('.share-copy-link').forEach(function(button) {
      var icon = button.querySelector('i');
      var label = button.querySelector('span');
      button.addEventListener('click', function() {
        copyText(button.getAttribute('data-url'), function() {
          icon.className = 'fas fa-fw fa-check';
          label.textContent = ' 복사됨';
          setTimeout(function() {
            icon.className = 'fas fa-fw fa-link';
            label.textContent = ' 링크 복사';
          }, 1500);
        });
      });
    });

    // ---- Click to zoom post images (Magnific Popup ships with the theme) ----
    var postImages = Array.prototype.filter.call(
      document.querySelectorAll('.page__content img'),
      function(img) { return !img.closest('a, .toc, .series-nav'); }
    );
    // only images shown smaller than their real size are worth zooming
    function markZoomable(img) {
      img.classList.toggle('zoomable', img.naturalWidth > img.clientWidth * 1.1);
    }
    postImages.forEach(function(img) {
      if (img.complete) markZoomable(img);
      img.addEventListener('load', function() { markZoomable(img); });
      img.addEventListener('click', function() {
        if (!img.classList.contains('zoomable') || !window.jQuery) return;
        var items = postImages.filter(function(i) { return i.classList.contains('zoomable'); });
        jQuery.magnificPopup.open({
          items: items.map(function(i) {
            // GitHub uploads get a generic "image" alt; don't show that as a caption
            return { src: i.currentSrc || i.src, title: /^image(\.\w+)?$/i.test(i.alt) ? '' : i.alt };
          }),
          type: 'image',
          gallery: { enabled: items.length > 1, navigateByImgClick: true, preload: [0, 1] },
          closeOnContentClick: items.length === 1
        }, items.indexOf(img));
      });
    });
    window.addEventListener('resize', function() { postImages.forEach(markZoomable); });

    // ---- Mermaid: ```mermaid code blocks become diagrams (library loaded only when used) ----
    // rouge has no mermaid lexer, so the block is <pre><code class="language-mermaid"> (or a
    // div.language-mermaid wrapper when highlighted); replace the outermost element either way
    var mermaidBlocks = [];
    document.querySelectorAll('div.language-mermaid, pre > code.language-mermaid').forEach(function(el) {
      var block = el.tagName === 'CODE' ? el.parentNode : el;
      if (mermaidBlocks.indexOf(block) < 0 && !mermaidBlocks.some(function(b) { return b.contains(block); })) {
        mermaidBlocks.push(block);
      }
    });
    if (mermaidBlocks.length) {
      var diagrams = mermaidBlocks.map(function(block) {
        var diagram = document.createElement('pre');
        diagram.className = 'mermaid';
        diagram.textContent = (block.querySelector('code') || block).textContent;
        block.parentNode.replaceChild(diagram, block);
        return { node: diagram, source: diagram.textContent };
      });
      var renderMermaid = function(theme) {
        diagrams.forEach(function(d) {
          d.node.removeAttribute('data-processed');
          d.node.textContent = d.source;
        });
        window.mermaid.initialize({ startOnLoad: false, theme: theme === 'dark' ? 'dark' : 'default' });
        window.mermaid.run({ nodes: diagrams.map(function(d) { return d.node; }) });
      };
      var mermaidScript = document.createElement('script');
      mermaidScript.src = 'https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js';
      mermaidScript.onload = function() {
        renderMermaid(window.__theme);
        themeListeners.push(renderMermaid);
      };
      document.head.appendChild(mermaidScript);
    }

    // ---- MathJax: loaded only when the post text (outside code) contains TeX ----
    var article = document.querySelector('.page__content');
    if (article) {
      var text = article.cloneNode(true);
      text.querySelectorAll('pre, code, script, style').forEach(function(el) {
        el.parentNode.removeChild(el);
      });
      // kramdown turns $$..$$ into \(..\) / \[..\]; single $..$ is passed through as is
      if (/\\\(|\\\[|\$[^$\s][^$]*\$/.test(text.textContent)) {
        window.MathJax = {
          tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']],
            processEscapes: true
          }
        };
        var mathjax = document.createElement('script');
        mathjax.id = 'MathJax-script';
        mathjax.async = true;
        mathjax.src = 'https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js';
        document.head.appendChild(mathjax);
      }
    }
  })();
</script>
