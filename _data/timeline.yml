# About 페이지의 경력·학력·활동 타임라인 (_includes/timeline.html)
# 시작이 최근인 항목을 위에 적는다. 위에서부터 카드가 왼쪽/오른쪽으로 번갈아 놓인다.
#
# type       : work | education | activity (가운데 축의 아이콘과 모양이 달라진다)
# title, org : 카드 제목과 소속. url이 있으면 제목이 링크가 된다.
# logo       : 소속 로고 이미지 경로 (assets/images/logos/)
# start, end : "YYYY-MM". end를 비우면 '현재'로 표시되고 기간은 방문 시점 기준으로 계산된다.
# duration   : 자동 계산 대신 보여줄 기간 문구 (예: 몇 주짜리 스터디)
# period     : start/end 대신 날짜 칸에 그대로 보여줄 문구 (예: 졸업 연도만 적을 때)
# highlights : 카드 안의 bullet. Markdown(**굵게**, [링크](url))을 쓸 수 있다.
#              하위 bullet이 필요하면 { text: "...", items: [...] } 형태로 적는다.

